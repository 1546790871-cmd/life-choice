<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1310">
<title>人生自选</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#120d0a;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  color:#f6ecdc;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 25%,#2c2019 0%,#100b08 72%)}
#stage{position:relative;height:100dvh;width:min(100vw, calc(100dvh * 9 / 16));overflow:hidden;
  background:#1b1410;--ux:min(1vw, 0.5625vh);--ink:#3a2b22;--paper:#fdf3e3;--accent:#e2793f;
  box-shadow:0 0 60px rgba(0,0,0,.6);touch-action:manipulation}
@supports (height:100dvh){#stage{--ux:min(1vw, 0.5625dvh)}}
button{font-family:inherit;border:0;background:none;color:inherit;padding:0;font-size:inherit}
input{font-family:inherit;-webkit-user-select:text;user-select:text}

/* ---------- 背景层 ---------- */
#bgLayer{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;background-size:cover;background-position:center}
.bg.on{opacity:1}
.bg svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#bgShade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(12,8,6,.22) 0%,rgba(12,8,6,0) 26%,rgba(12,8,6,.06) 62%,rgba(12,8,6,.34) 100%)}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,transparent 45%,rgba(12,8,6,.55) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.5) .6px,transparent .6px);background-size:3px 3px}

/* ---------- 立绘 ---------- */
#spriteLayer{position:absolute;left:0;right:0;bottom:calc(var(--ux) * 29);height:58%;pointer-events:none;
  display:flex;align-items:flex-end;justify-content:center}
#spriteLayer.two .sp{height:66%}
#spriteLayer.two .sp1{left:24%}
#spriteLayer.two .sp2{left:76%}
.sp{position:absolute;bottom:0;height:100%;opacity:0;
  transition:filter .35s ease,transform .5s cubic-bezier(.22,.9,.3,1),opacity .4s ease;
  filter:brightness(.74) saturate(.82);transform-origin:50% 100%}
.sp svg,.sp img{height:100%;width:auto;display:block;filter:drop-shadow(0 8px 22px rgba(20,10,5,.42))}
.sp img{max-width:none;object-fit:contain;object-position:bottom}
.sp.active{filter:brightness(1.04) saturate(1)}
.sp.vis{opacity:1}
.sp.hiddenSp{opacity:0;transform:translateY(14px)}
.sp.breathe .body{animation:breathe 5.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.1%) scale(1.008)}}
.sp0{left:50%;transform:translateX(-50%)}
.sp1{left:32%;transform:translateX(-50%) scale(.9)}
.sp2{left:68%;transform:translateX(-50%) scale(.9)}

/* ---------- 顶部 HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:30;padding:calc(env(safe-area-inset-top,0px) + var(--ux)*2.2) calc(var(--ux)*3.4) 0;
  background:linear-gradient(180deg,rgba(20,13,10,.86) 0%,rgba(20,13,10,.55) 68%,rgba(20,13,10,0) 100%);
  transition:opacity .25s ease}
#stage.sheet-open #hud{opacity:0;pointer-events:none}
.hudRow1{display:flex;align-items:center;gap:calc(var(--ux)*2)}
.hudWeek{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hudWeek b{font-size:calc(var(--ux)*3.9);font-weight:700;letter-spacing:.5px;color:#ffe9c9;white-space:nowrap}
.hudWeek span{font-size:calc(var(--ux)*2.9);color:#cbb9a2;white-space:nowrap}
.hudCoins{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(var(--ux)*1.4);
  font-size:calc(var(--ux)*3.7);font-weight:700;color:#ffd88e;white-space:nowrap}
.hudAp{display:flex;gap:calc(var(--ux)*.9);align-items:center}
.apDot{width:calc(var(--ux)*3.1);height:calc(var(--ux)*3.1);border-radius:50% 50% 46% 46%;
  background:linear-gradient(180deg,#ff9c9c,#e2545c);box-shadow:0 0 6px rgba(255,120,130,.5);transition:all .25s}
.apDot.off{background:rgba(255,255,255,.16);box-shadow:none}
.apTxt{font-size:calc(var(--ux)*2.9);color:#f3c9bd;margin-left:calc(var(--ux)*.6)}
.iconBtn{width:calc(var(--ux)*8.2);height:calc(var(--ux)*8.2);border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(255,240,220,.13);border:1px solid rgba(255,230,200,.2);font-size:calc(var(--ux)*3.9);color:#f6e4c8;
  flex:0 0 auto;transition:transform .15s,background .2s}
.iconBtn:active{transform:scale(.92);background:rgba(255,240,220,.26)}
.iconBtn svg{display:block}
.coinIcon{display:inline-block;width:calc(var(--ux)*3.5);height:calc(var(--ux)*3.5);border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#fff0bd,#f6c25a 55%,#c98a2e 100%);
  box-shadow:inset 0 0 0 1px rgba(255,246,214,.55),0 1px 4px rgba(0,0,0,.35);
  margin-right:calc(var(--ux)*.9);vertical-align:middle}
.progressWrap{margin-top:calc(var(--ux)*1.8)}
.progressBar{height:calc(var(--ux)*1.1);border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.progressBar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#e9a99a,#c96a63 60%,#a44d4c);transition:width .6s ease}
.progressLabel{margin-top:calc(var(--ux)*.9);font-size:calc(var(--ux)*2.55);color:#cdbca7;letter-spacing:.3px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniStats{display:flex;gap:calc(var(--ux)*1.2);margin-top:calc(var(--ux)*1.4);padding-bottom:calc(var(--ux)*1.4)}
.msItem{flex:1;min-width:0;background:rgba(0,0,0,.22);border-radius:calc(var(--ux)*1.6);padding:calc(var(--ux)*.9) calc(var(--ux)*.8);
  cursor:pointer;border:1px solid rgba(255,255,255,.06)}
.msItem .msL{font-size:calc(var(--ux)*2.45);color:#bda98f;text-align:center;white-space:nowrap}
.msItem .msBar{margin-top:calc(var(--ux)*.55);height:calc(var(--ux)*1.05);border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
.msItem .msBar i{display:block;height:100%;width:0;transition:width .5s ease}
.msItem .msV{font-size:calc(var(--ux)*2.4);color:#f0dfc6;text-align:center;margin-top:calc(var(--ux)*.35);font-variant-numeric:tabular-nums}

/* ---------- 章节标题卡 ---------- */
.chapterCard{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 45%,rgba(46,31,21,.985),rgba(9,6,4,.997));text-align:center}
.chapterCard.show{display:flex}
.chapterCard.out{animation:ccOut .55s ease forwards}
.ccInner{padding:0 calc(var(--ux)*7)}
.ccKicker{font-size:calc(var(--ux)*3);letter-spacing:calc(var(--ux)*1.4);color:#d89186;margin-bottom:calc(var(--ux)*2.4)}
.chapterCard h1{font-size:calc(var(--ux)*9);margin:0;letter-spacing:calc(var(--ux)*1.2);color:#fff3df;font-weight:800;
  text-shadow:0 2px 20px rgba(255,170,90,.35)}
.chapterCard p{font-size:calc(var(--ux)*3.1);color:#c6b39c;margin-top:calc(var(--ux)*2.4);line-height:1.7}
.ccLine{width:calc(var(--ux)*14);height:1px;background:linear-gradient(90deg,transparent,#c96a63,transparent);margin:calc(var(--ux)*2.6) auto 0}
@keyframes ccIn{from{opacity:0}to{opacity:1}}
@keyframes ccOut{from{opacity:1}to{opacity:0}}

/* ---------- 对话框 ---------- */
#dialogWrap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--ux)*2.2);z-index:40;
  display:flex;flex-direction:column;align-items:center;gap:calc(var(--ux)*2);pointer-events:none}
#choices{width:88%;display:flex;flex-direction:column;gap:calc(var(--ux)*1.7);max-height:44vh;overflow-y:auto;
  padding:calc(var(--ux)*1);pointer-events:auto;scrollbar-width:none}
#choices::-webkit-scrollbar{display:none}
.choiceBtn{width:100%;text-align:left;padding:calc(var(--ux)*3) calc(var(--ux)*3.4);border-radius:99px;
  background:rgba(255,246,232,.94);color:#3a2b22;font-size:calc(var(--ux)*3.55);line-height:1.45;font-weight:600;
  border:1px solid rgba(255,255,255,.75);box-shadow:0 6px 18px rgba(0,0,0,.3);transition:transform .12s,background .2s;
  display:flex;align-items:center;gap:calc(var(--ux)*1.6)}
@keyframes chIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.choiceBtn:active{transform:scale(.98);background:#fff}
.choiceBtn.locked{background:rgba(120,108,96,.62);color:rgba(255,255,255,.55);border-color:rgba(255,255,255,.12);
  box-shadow:none;border-style:dashed}
.choiceBtn .chMark{font-size:calc(var(--ux)*3);opacity:.55;flex:0 0 auto}
.choiceBtn .chNeed{font-size:calc(var(--ux)*2.7);font-weight:400;opacity:.8;margin-left:auto;white-space:nowrap}
.dialog{position:relative;width:92%;min-height:calc(var(--ux)*30);border-radius:calc(var(--ux)*2.6);
  background:none;border:calc(var(--ux)*3.2) solid transparent;
  border-image:url("assets/ui/dialog.webp") 96 fill stretch;
  box-shadow:0 14px 34px rgba(15,8,4,.42);padding:calc(var(--ux)*4.4) calc(var(--ux)*5.2) calc(var(--ux)*5.2);
  pointer-events:auto}
.dialog.empty{opacity:0;pointer-events:none}
.namePlate{position:absolute;top:0;left:calc(var(--ux)*5.4);transform:translateY(-54%);
  padding:calc(var(--ux)*1.1) calc(var(--ux)*3.4);border-radius:calc(var(--ux)*1.2);font-size:calc(var(--ux)*3.5);font-weight:700;
  background:linear-gradient(180deg,#d89186,#b85f5e 60%,#9c4a4c);color:#fff7ea;letter-spacing:1px;
  box-shadow:0 5px 14px rgba(80,30,20,.45),inset 0 1px 0 rgba(255,240,225,.5);white-space:nowrap}
.namePlate::before,.namePlate::after{content:"";position:absolute;top:50%;width:calc(var(--ux)*2.2);height:calc(var(--ux)*1.5);
  background:linear-gradient(180deg,#c97a72,#a45454);transform:translateY(-50%)}
.namePlate::before{left:calc(var(--ux)*-1.6);clip-path:polygon(100% 0,100% 100%,0 50%)}
.namePlate::after{right:calc(var(--ux)*-1.6);clip-path:polygon(0 0,100% 50%,0 100%)}
.namePlate.narr{background:linear-gradient(180deg,#8d7460,#6d5647);color:#f6e7d2;border:none;
  box-shadow:0 5px 14px rgba(40,20,10,.4)}
.dialogText{font-size:calc(var(--ux)*4.05);line-height:1.74;color:#4d3626;min-height:calc(var(--ux)*10.5);word-break:break-word;white-space:pre-wrap;
  text-shadow:0 1px 0 rgba(255,250,240,.55)}
.dialogText .em{color:#b2572f}
.dialogHint{position:absolute;right:calc(var(--ux)*5.4);bottom:calc(var(--ux)*2.2);font-size:calc(var(--ux)*2.5);color:rgba(120,80,50,.6);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:.95}}

/* ---------- 浮动数值 ---------- */
#floats{position:absolute;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.float{position:absolute;font-size:calc(var(--ux)*3.5);font-weight:800;color:#8ef0a8;text-shadow:0 2px 8px rgba(0,0,0,.7);
  animation:flUp 3s ease-out forwards;white-space:nowrap}
.float.bad{color:#ff8f8f}
.float.gold{color:#ffd86e}
.float.pink{color:#ff9fc4}
.float.blue{color:#9fd0ff}
@keyframes flUp{0%{opacity:0;transform:translateY(14px) scale(.9)}12%{opacity:1;transform:translateY(0) scale(1)}
  70%{opacity:1}100%{opacity:0;transform:translateY(-52px) scale(1.02)}}

/* ---------- Toast ---------- */
#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);z-index:95;
  background:rgba(30,21,16,.94);color:#ffe8c8;padding:calc(var(--ux)*2.4) calc(var(--ux)*4);border-radius:99px;
  font-size:calc(var(--ux)*3.2);border:1px solid rgba(255,210,170,.3);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;max-width:86%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,-6px)}

/* ---------- 行动面板 ---------- */
#actionPanel{position:absolute;left:0;right:0;bottom:0;z-index:35;display:none;flex-direction:column;
  padding:calc(var(--ux)*3) calc(var(--ux)*3.4) calc(env(safe-area-inset-bottom,0px) + var(--ux)*3);
  background:linear-gradient(180deg,rgba(18,11,8,.16) 0%,rgba(18,11,8,.88) 16%,rgba(16,10,7,.97) 46%,rgba(14,9,6,.995) 100%)}
#actionPanel.show{display:flex}
@keyframes apIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.apHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:calc(var(--ux)*2.2);
  background:rgba(28,18,12,.72);border:1px solid rgba(255,225,190,.16);border-radius:calc(var(--ux)*2.2);
  padding:calc(var(--ux)*1.8) calc(var(--ux)*2.2)}
.apHead .t{font-size:calc(var(--ux)*3.4);font-weight:700;color:#ffe6c4}
.apHead .t small{display:block;font-size:calc(var(--ux)*2.6);font-weight:400;color:#b9a58d;margin-top:calc(var(--ux)*.5)}
.apHead .stressChip{font-size:calc(var(--ux)*2.7);color:#ffb3a3;background:rgba(255,120,120,.14);
  border:1px solid rgba(255,140,130,.3);padding:calc(var(--ux)*1) calc(var(--ux)*2.2);border-radius:99px;white-space:nowrap}
.apGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:calc(var(--ux)*2)}
.actBtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--ux)*.6);
  padding:calc(var(--ux)*2.2) calc(var(--ux)*2.2) calc(var(--ux)*2);
  border-radius:calc(var(--ux)*2.6);
  background:
    linear-gradient(165deg,rgba(255,250,240,.97),rgba(247,234,213,.95)),
    url("assets/ui/paper.webp");
  background-size:cover;background-blend-mode:multiply;
  border:1px solid rgba(150,104,66,.35);box-shadow:0 5px 14px rgba(15,8,4,.3),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .12s,filter .2s;overflow:hidden}
.actBtn:active{transform:scale(.97);filter:brightness(1.04)}
.actBtn.dim{opacity:.45}
.actBtn .ai{width:calc(var(--ux)*8.4);height:calc(var(--ux)*8.4);display:block}
.actBtn .ai img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 2px 4px rgba(90,50,20,.25))}
.actBtn .an{font-size:calc(var(--ux)*3.15);font-weight:800;color:#49311f}
.actBtn .ac{font-size:calc(var(--ux)*2.5);color:#b4552e;font-weight:700}
.actBtn .ae{font-size:calc(var(--ux)*2.2);color:#8a6d52;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#orgRow{margin-top:calc(var(--ux)*2)}
#orgRow .actBtn{flex-direction:row;align-items:center;gap:calc(var(--ux)*1.8);padding:calc(var(--ux)*2.2)}
#orgRow .actBtn .ae{margin-left:auto;text-align:right;white-space:normal}
.paceRow{display:flex;align-items:center;gap:calc(var(--ux)*1.4);margin-top:calc(var(--ux)*1.8);flex-wrap:wrap}
.paceChip{font-size:calc(var(--ux)*2.5);padding:calc(var(--ux)*1) calc(var(--ux)*2.2);border-radius:99px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,225,190,.22);color:#d8c5aa}
.paceChip.on{background:linear-gradient(180deg,#d89186,#b85f5e 60%,#9c4a4c);color:#fff8ee;border-color:transparent}
.paceHint{font-size:calc(var(--ux)*2.3);color:#a8947d;flex:1;min-width:calc(var(--ux)*40)}
.orgNote{font-size:calc(var(--ux)*2.6);color:#a48f78;padding:calc(var(--ux)*1.6) calc(var(--ux)*2);border:1px dashed rgba(255,225,190,.2);border-radius:calc(var(--ux)*2.4);text-align:center}
.apFoot{display:flex;gap:calc(var(--ux)*2);margin-top:calc(var(--ux)*2.2)}
.apFoot button{flex:1;padding:calc(var(--ux)*2.3);border-radius:calc(var(--ux)*2.4);font-size:calc(var(--ux)*2.9);
  background:linear-gradient(165deg,rgba(255,250,240,.95),rgba(246,232,210,.9));border:1px solid rgba(150,104,66,.35);
  color:#4a3222;font-weight:700;box-shadow:0 4px 12px rgba(15,8,4,.25)}
.apFoot button:active{filter:brightness(1.05)}

/* ---------- 通用弹层 ---------- */
#sheetHost{position:absolute;inset:0;z-index:90;display:none}
#sheetHost.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,5,4,.8);backdrop-filter:blur(4px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#2b1d16 0%,#1d1410 100%);border-radius:calc(var(--ux)*5) calc(var(--ux)*5) 0 0;
  border-top:1px solid rgba(255,210,165,.3);box-shadow:0 -10px 40px rgba(0,0,0,.6);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + var(--ux)*2.5)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheetHead{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--ux)*3.4) calc(var(--ux)*4) calc(var(--ux)*2);
  border-bottom:1px solid rgba(255,220,180,.12)}
.sheetHead h2{margin:0;font-size:calc(var(--ux)*4.2);color:#ffe9cc;font-weight:800;letter-spacing:.5px}
.sheetHead .sub{font-size:calc(var(--ux)*2.5);color:#b6a38c;margin-top:calc(var(--ux)*.4)}
.sheetClose{width:calc(var(--ux)*8);height:calc(var(--ux)*8);border-radius:50%;background:rgba(255,240,220,.1);
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--ux)*4);color:#e9d6bd;flex:0 0 auto}
.sheetBody{overflow-y:auto;padding:calc(var(--ux)*3) calc(var(--ux)*4) calc(var(--ux)*2);-webkit-overflow-scrolling:touch}
.sheetBody::-webkit-scrollbar{width:0}
.secTitle{font-size:calc(var(--ux)*2.8);color:#c9a06a;letter-spacing:1px;margin:calc(var(--ux)*2.6) 0 calc(var(--ux)*1.6);
  display:flex;align-items:center;gap:calc(var(--ux)*1.4)}
.secTitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,210,165,.3),transparent)}
.btnRow{display:flex;gap:calc(var(--ux)*2);flex-wrap:wrap}
.btn{flex:1;min-width:calc(var(--ux)*30);padding:calc(var(--ux)*2.6);border-radius:calc(var(--ux)*2.6);
  background:linear-gradient(160deg,rgba(255,240,220,.14),rgba(255,240,220,.06));border:1px solid rgba(255,225,190,.22);
  color:#f6e6cd;font-size:calc(var(--ux)*3);font-weight:600;text-align:center;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97);background:rgba(255,240,220,.22)}
.btn.primary{background:linear-gradient(180deg,#d89186,#b85f5e 58%,#9c4a4c);border-color:transparent;color:#fff8ee;
  box-shadow:0 6px 18px rgba(120,50,45,.35)}
.btn.ghost{background:transparent;border-color:rgba(255,225,190,.3)}
.btn.small{font-size:calc(var(--ux)*2.6);padding:calc(var(--ux)*1.9)}
.btn.disabled{opacity:.42}

/* ---------- CG 鉴赏 ---------- */
#cgHost{position:absolute;inset:0;z-index:93;display:none}
#cgHost.show{display:block;animation:fadeIn .22s ease}
.cgOverlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + var(--ux)*4) calc(var(--ux)*3.6) calc(env(safe-area-inset-bottom,0px) + var(--ux)*4);
  background:rgba(6,4,3,.9);overflow:hidden}
.cgOverlay::before{content:"";position:absolute;inset:calc(var(--ux)*-8);background-image:var(--cg-bg);background-size:cover;
  background-position:center;filter:blur(28px) brightness(.42) saturate(.85);transform:scale(1.1)}
.cgOverlay::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%)}
.cgCard{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--ux)*2);max-width:100%;max-height:100%}
.cgCard img{max-width:92vw;max-height:68vh;width:auto;height:auto;object-fit:contain;display:block;
  border-radius:calc(var(--ux)*2.2);border:1px solid rgba(255,226,190,.45);box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 0 8px rgba(255,240,220,.04)}

}

/* 周历：周次 → 剧情节点 / 生日 / 年度事件 / 考试 / 章节卡 */
const MONTHS = [9,10,11,12,1,2,3,7];
const ACT2_MONTHS = {
  25:9, 26:10, 27:11, 28:12, 29:1, 30:3,
  31:9, 32:10, 33:11, 34:12, 35:1,
  36:9, 37:10, 38:11, 39:12, 40:3,
  41:5, 42:6
};
const ACT3_MONTHS = {
  43:3,44:9,45:3,46:9,47:3,48:9,49:3,50:9,51:3,52:9,53:3,54:9,55:3,56:9,57:3,58:9,59:12,60:1
};
function monthOfWeek(w){
  if (w > 42) return ACT3_MONTHS[w] || 3;
  if (w > 24) return ACT2_MONTHS[w] || 9;
  return MONTHS[(w - 1) % 8];
}
function careerYearOfWeek(w){
  if (w < 43) return 0;
  const col = (typeof S !== 'undefined' && S && S.branch === 'col');
  const maxYear = col ? 9 : 8;
  return Math.min(maxYear, Math.floor((w - 43) / 2) + 1);
}
function ageOfWeek(w){
  if (w < 43) return null;
  if (w >= 60) return 30;
  const col = (typeof S !== 'undefined' && S && S.branch === 'col');
  const base = col ? 21 : 22;
  const idx = Math.floor((w - 43) / 2);
  const years = col ? 9 : 8;
  return base + Math.min(idx, years - 1);
}
function yearOfWeek(w){
  return w <= 8 ? 1 : (w <= 16 ? 2 : 3);
}
function gradeOfWeek(w){
  if (w > 42) return `入职第${careerYearOfWeek(w)}年`;
  if (w <= 8) return '高一';
  if (w <= 16) return '高二';
  if (w <= 24) return '高三';
  const col = (typeof S !== 'undefined' && S && S.branch === 'col');
  if (w <= 30) return '大一';
  if (col){
    if (w <= 36) return '大二';
    return '大三';
  }
  if (w <= 35) return '大二';
  if (w <= 40) return '大三';
  return '大四';
}
function termOfWeek(w){
  if (w > 42) return `${ageOfWeek(w)} 岁`;
  if (w > 24){
    const m = monthOfWeek(w);
    return (m >= 9 || m === 1) ? '上学期' : '下学期';
  }
  const i = (w - 1) % 8;
  if (i <= 4) return '上学期';
  if (i === 5) return '寒假';
  return '下学期';
}
function actOfWeek(w){ return w <= CFG.act1End ? 1 : (w <= CFG.act2End ? 2 : 3); }
function actInfo(w){
  const act = actOfWeek(w);
  const start = act === 1 ? CFG.act1Start : (act === 2 ? CFG.act2Start : CFG.act3Start);
  const end = act === 1 ? CFG.act1End : (act === 2 ? CFG.act2End : CFG.totalWeeks);
  return { act, start, end, len: end - start + 1, idx: clampWeek(w - start + 1) };
}
function clampWeek(n){ return Math.max(1, Math.min(99, n)); }

function say(id, text){ return { t:'c', id, text }; }

function fx(kicker, title, desc){ return { t:'fx', kicker, title, desc }; }
function cast(list, focus){ return { t:'cast', list, focus }; }
function opt(text, eff, reply, extra){
  return Object.assign({ text, eff: eff || {}, reply: reply || [] }, extra || {});
}
function choice(prompt, opts){ return { t:'choice', prompt, opts }; }
function dyn(fn){ return { t:'dyn', fn }; }

function bdayScene(who, giftName, optYes, optMid, optNo, sceneBg){
  const c = CHARS[who];
  return {
    bg: sceneBg || 'classroom',
    steps: [
      { t:'eff', eff:{ counter:{ ['bd_' + who]: 1 } } },
      fx('生日', `${c.birth} · ${c.name}生日`, `今天是她/他的生日`),
      nar(`今天是${c.name}的生日。`),
      say(who, who === 'sunian' ? '今天……其实是我生日。我没告诉几个人。' :
        who === 'luchen' ? '没什么特别的。就是又长了一岁。' :
        who === 'jiangwan' ? '我生日。今天想画一张给自己的画。' :
        '今天我生日！晚上请大家吃烤串！'),
      choice(`你要送什么给${c.name}？`, [
        opt(optYes[0], optYes[1], optYes[2]),
        opt(optMid[0], optMid[1], optMid[2]),
        opt(optNo[0], optNo[1], optNo[2])
      ])
    ]
  };
}

/* ---------------- 本地存储 ---------------- */
function lsGet(k, fb){
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; }
}
function loadSettings(){
  const s = lsGet(SK.settings, null);
  if (s && typeof s === 'object') SETTINGS = Object.assign(SETTINGS, s);
  READ = lsGet(SK.read, {}) || {};
}
function saveSettings(){ lsSet(SK.settings, SETTINGS); }
function markRead(key){ READ[key] = 1; lsSet(SK.read, READ); }

function normalizeState(raw){
  const base = newState();
  if (!raw || typeof raw !== 'object') return base;
  const st = Object.assign(base, raw);
  st.stats = Object.assign(base.stats, raw.stats || {});
  st.hidden = Object.assign(base.hidden, raw.hidden || {});
  st.aff = Object.assign(base.aff, raw.aff || {});
  st.met = Object.assign(base.met, raw.met || {});
  st.items = Object.assign(base.items, raw.items || {});
  st.spec = Object.assign(base.spec, raw.spec || {});
  st.titles = Array.isArray(raw.titles) ? raw.titles : [];
  st.contrib = clamp(Number(st.contrib) || 0, 0, 100);
  st.exp = clamp(Number(st.exp) || 0, 0, 100);
  st.skill = clamp(Number(st.skill) || 0, 0, 100);
  st.network = clamp(Number(st.network) || 0, 0, 100);
  if (!st.title || !/^L[1-5]$/.test(st.title)) st.title = 'L1';
  if (!st.pace) st.pace = 'normal';
  st.act = Number(st.act) || (st.week > CFG.act1End ? 2 : 1);
  if (!st.branch) st.branch = (st.gaokao === 'col') ? 'col' : 'uni';
  st.flags = Object.assign(base.flags, raw.flags || {});
  st.achs = Object.assign({}, raw.achs || {});
  st.cg = Object.assign({}, raw.cg || {});
  st.flagNodes = Object.assign({}, raw.flagNodes || {});
  st.randSeen = Object.assign({}, raw.randSeen || {});
  try {
    const allNodes = lsGet(FLAG_NODE_STORE, {}) || {};
    const savedNodes = allNodes[st.createdAt] || {};
    for (const k in savedNodes) if (!st.flagNodes[k]) st.flagNodes[k] = savedNodes[k];
  } catch(e){}
  migrateFlagNodes(st);
  st.examLog = Array.isArray(raw.examLog) ? raw.examLog : [];
  st.history = Array.isArray(raw.history) ? raw.history : [];
  st.weekLog = Array.isArray(raw.weekLog) ? raw.weekLog : [];
  st.video = Object.assign(base.video, raw.video || {});
  ['int','eq','str','cha','cre','fin'].forEach(k => { st.stats[k] = clamp(Number(st.stats[k]) || 0, 0, 100); });
  ['stress','happy','familyRel'].forEach(k => { st.hidden[k] = clamp(Number(st.hidden[k]) || 0, 0, 100); });
  for (const k in st.aff) st.aff[k] = clamp(Number(st.aff[k]) || 0, 0, 100);
  st.coins = Math.max(0, Math.round(Number(st.coins) || 0));
  st.diamond = Math.max(0, Math.round(Number(st.diamond) || 0));
  st.mem = Math.max(0, Math.round(Number(st.mem) || 0));
  if (!st.sessionId) st.sessionId = sessionId;
  if (st.gender !== 'm' && st.gender !== 'f') st.gender = 'f';
  return st;
}

/* ---------------- 音频 ---------------- */
const Audio = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  started: false, muted: false, nextNote: 0, step: 0, timer: 0,
  unlock(){
    if (this.started) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = (SETTINGS.volume / 100) * 0.9;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.value = 0.16;
      this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.value = 0.5;
      this.sfxGain.connect(this.master);
      this.started = true;
      this.nextNote = this.ctx.currentTime + 0.2;
    } catch(e){ this.started = false; }
  },
  setVolume(v){
    SETTINGS.volume = v;
    if (this.master) this.master.gain.value = (v / 100) * 0.9;
    this.muted = v === 0;
    saveSettings();
  },
  toggleMute(){
    if (this.muted || SETTINGS.volume === 0){
      SETTINGS.volume = 55; this.muted = false;
      if (this.master) this.master.gain.value = 0.5;
    } else {
      this.muted = true;
      if (this.master) this.master.gain.value = 0;
    }
    saveSettings();
    return this.muted;
  },
  tone(freq, dur, type, gain, when, dest){
    const ctx = this.ctx; if (!ctx) return;
    const t = when || ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain || 0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(dest || this.sfxGain);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  sfx(kind){
    if (!this.started || this.muted || SETTINGS.volume === 0) return;
    const t = this.ctx.currentTime;
    if (kind === 'tap') this.tone(660, 0.09, 'triangle', 0.12, t);
    else if (kind === 'page') this.tone(420, 0.06, 'sine', 0.07, t);
    else if (kind === 'choice'){ this.tone(523.25, 0.16, 'triangle', 0.16, t); this.tone(783.99, 0.22, 'triangle', 0.13, t + 0.08); }
    else if (kind === 'stat'){ this.tone(880, 0.14, 'sine', 0.12, t); this.tone(1174.7, 0.2, 'sine', 0.1, t + 0.07); }
    else if (kind === 'coin'){ this.tone(988, 0.1, 'square', 0.07, t); this.tone(1318.5, 0.16, 'square', 0.06, t + 0.06); }
    else if (kind === 'achieve'){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.14, t + i * 0.09)); }
    else if (kind === 'bday'){ [659.25, 783.99, 987.77, 1318.5].forEach((f, i) => this.tone(f, 0.44, 'sine', 0.12, t + i * 0.13)); }
    else if (kind === 'error') this.tone(196, 0.22, 'sawtooth', 0.08, t);
    else if (kind === 'open') this.tone(392, 0.12, 'sine', 0.1, t);
  },
  /* 温暖的钢琴式循环（D 大调五声），由主循环驱动调度 */
  schedule(){
    if (!this.started || this.muted || SETTINGS.volume === 0) return;
    const ctx = this.ctx;
    if (!ctx) return;
    if (ctx.state === 'suspended') { ctx.resume().catch(() => {}); }
    const lookahead = 0.8;
    if (this.nextNote < ctx.currentTime) this.nextNote = ctx.currentTime + 0.1;
    while (this.nextNote < ctx.currentTime + lookahead){
      this.playStep(this.nextNote);
      this.nextNote += 0.62;
      this.step = (this.step + 1) % 32;
    }
  },
  playStep(t){
    // 和弦进行：Dmaj7 - Bm7 - Gmaj7 - A7（每小节 4 拍）
    const prog = [
      [146.83, 185.00, 220.00, 277.18],
      [123.47, 146.83, 185.00, 220.00],
      [98.00, 123.47, 146.83, 185.00],
      [110.00, 138.59, 164.81, 220.00]
    ];
    const bar = Math.floor(this.step / 8) % 4;
    const chord = prog[bar];
    const idx = this.step % 8;
    const melody = [0, 2, 1, 3, 2, 1, 3, 2];
    const n = chord[melody[idx]] * 2;
    this.pad(t, chord[0] / 2, 2.4);
    if (idx % 2 === 0) this.pad(t, n, 1.1, 0.05);
    this.pad(t, n * 1.5, 0.9, 0.028);
    if (this.step % 16 === 0) this.pad(t, chord[1], 3.6, 0.05);
  },
  pad(t, freq, dur, gain){
    const ctx = this.ctx; if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.value = 2200; filt.Q.value = 0.6;
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain || 0.09, t + 0.16);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(filt); filt.connect(g); g.connect(this.musicGain);
    osc.start(t); osc.stop(t + dur + 0.1);
  }
};

/* ---------------- 文本与历史 ---------------- */
function interp(t){ return String(t == null ? '' : t).replace(/\{name\}/g, (S && S.name) || '林晚'); }

function historyPush(name, text){
  if (!S) return;
  S.history.push({ n: name, t: text, w: S.week });

/* ---------------- 数值 ---------------- */
function stepOf(v){
  if (v < 40) return 1.5;
  if (v < 70) return 1.0;
  if (v < 90) return 0.5;
  if (v < 95) return 0.2;
  return 0.1;
}
function psm(){
  if (!S) return 1;
  if (S.personality === 'calm') return 0.9;
  if (S.personality === 'warm' || S.personality === 'will') return 1.1;
  return 1;
}
function topStat(){
  let best = 'int', bv = -1;
  STAT_META.forEach(m => { if (S.stats[m.key] > bv){ bv = S.stats[m.key]; best = m.key; } });
  return best;
}
function gainStat(key, amount, silent){
  if (!S || !(key in S.stats)) return 0;
  const before = S.stats[key];
  S.stats[key] = clamp(S.stats[key] + amount, 0, 100);
  const d = S.stats[key] - before;
  if (!silent && Math.abs(d) > 0.001){
    const meta = STAT_META.find(m => m.key === key);
    floatText(`${meta ? meta.name : key} ${d > 0 ? '+' : ''}${fmt1(d)}`, d > 0 ? '' : 'bad');
  }
  return d;
}
function addStress(n, silent){
  if (!S) return;
  const before = S.hidden.stress;
  S.hidden.stress = clamp(S.hidden.stress + n * psm(), 0, 100);
  if (!silent) floatText(`压力 ${S.hidden.stress - before > 0 ? '+' : ''}${fmt1(S.hidden.stress - before)}`, 'bad');
}
function addHappy(n, silent){
  if (!S) return;
  const before = S.hidden.happy;
  S.hidden.happy = clamp(S.hidden.happy + n, 0, 100);
  if (!silent) floatText(`幸福 ${S.hidden.happy - before > 0 ? '+' : ''}${fmt1(S.hidden.happy - before)}`, 'pink');
}
function addFamily(n, silent){
  if (!S) return;
  const before = S.hidden.familyRel;
  S.hidden.familyRel = clamp(S.hidden.familyRel + n, 0, 100);
  if (!silent) floatText(`家庭 ${S.hidden.familyRel - before > 0 ? '+' : ''}${fmt1(S.hidden.familyRel - before)}`, 'pink');
}
function addAff(id, n, silent){
  if (!S || !(id in S.aff)) return 0;
  const before = S.aff[id];
  S.aff[id] = clamp(S.aff[id] + n, 0, 100);
  const d = S.aff[id] - before;
  if (!silent && Math.abs(d) > 0.001){
    floatText(`${CHARS[id] ? CHARS[id].name : id} 好感 ${d > 0 ? '+' : ''}${fmt1(d)}`, d > 0 ? 'pink' : 'bad');
  }
  return d;
}
function addCoins(n, silent){
  if (!S) return;
  S.coins = Math.max(0, S.coins + Math.round(n));
  if (!silent) floatText(`金币 ${n > 0 ? '+' : ''}${Math.round(n)}`, 'gold');
}
function giveItem(id, n){
  if (!S || !ITEMS[id]) return;
  S.items[id] = (S.items[id] || 0) + (n || 1);
  Audio.sfx('coin');
  toast(`获得道具：${ITEMS[id].icon} ${ITEMS[id].name} ×${n || 1}`);
}
function useItem(id, target){
  if (!S || !ITEMS[id] || (S.items[id] || 0) <= 0) { toast('没有这个道具'); return false; }
  const it = ITEMS[id];
  if (it.use === 'target' && !target){ return false; }
  S.items[id] -= 1;
  Audio.sfx('stat');
  if (id === 'study'){ S.studyKitWeek = true; toast('本周智力成长 +10%'); }
  else if (id === 'gear'){ gainStat('str', 2); toast('体魄 +2'); }
  else if (id === 'sketch'){ gainStat('cre', 2); toast('创造力 +2'); }
  else if (id === 'gift'){ addAff(target, 2); toast(`送给${CHARS[target].name}：好感 +2`); }
  else if (id === 'dessert'){ addHappy(3); toast('幸福度 +3'); }
  renderHUD(); autosave(); checkAch();
  return true;
}

/* ---------------- 效果应用 ---------------- */
function applyEff(eff){
  if (!eff || !S) return;
  const dup = mainDuplicateNodes(eff);
  const hasDup = !!(dup.sunian1 || dup.sunian2 || dup.baiyu1 || dup.baiyu2);
  const m2 = actMult();
  ['int','eq','str','cha','cre','fin'].forEach(k => {
    if (typeof eff[k] !== 'number' || eff[k] === 0) return;
    gainStat(k, eff[k] > 0 ? eff[k] * m2 : eff[k]);
  });
  if (typeof eff.contrib === 'number' && eff.contrib !== 0) addContrib(eff.contrib);
  if (eff.major){
    if (MAJORS[eff.major]) S.major = eff.major;
    else if (COLLEGE_MAJORS[eff.major]) S.major = eff.major;
    if (MAJORS[S.major]) toast(`专业：${MAJORS[S.major].name}（${MAJORS[S.major].desc}）`);
    else if (COLLEGE_MAJORS[S.major]) toast(`专业：${COLLEGE_MAJORS[S.major].name}（${COLLEGE_MAJORS[S.major].desc}）`);
  }
  if (typeof eff.certEffort === 'number') S.certEffort = eff.certEffort;
  if (typeof eff.exp === 'number'){ S.exp = clamp((S.exp || 0) + eff.exp, 0, 100); floatText(`经验 +${fmt1(eff.exp)}`, 'blue'); }
  if (typeof eff.skill === 'number'){ S.skill = clamp((S.skill || 0) + eff.skill, 0, 100); floatText(`专业 +${fmt1(eff.skill)}`, 'blue'); }
  if (typeof eff.network === 'number'){ S.network = clamp((S.network || 0) + eff.network, 0, 100); floatText(`人脉 +${fmt1(eff.network)}`, 'blue'); }
  if (eff.industry && INDUSTRIES[eff.industry]) S.industry = eff.industry;
  if (eff.jobPath && CAREER_PATHS[eff.jobPath]){ S.jobPath = eff.jobPath; toast(`职业类别：${CAREER_PATHS[eff.jobPath].name}`); }
  if (eff.title && /^L[1-5]$/.test(eff.title)) S.title = eff.title;
  if (eff.pace && PACES[eff.pace]) S.pace = eff.pace;
  if (eff.familyEnd && FAMILY_ENDS[eff.familyEnd]) S.familyEnd = eff.familyEnd;
  if (eff.lover && CHARS[eff.lover]) {
    const blockedLover = (dup.sunian2 && eff.lover === 'sunian') || (dup.baiyu2 && eff.lover === 'baiyu');
    if (!blockedLover){ S.lover = eff.lover; S.flags.flag2 = true; }
  }
  if (eff.route && (eff.route === 'job' || eff.route === 'entrepreneur')){
    S.route = eff.route;
    toast(eff.route === 'job' ? '路线：职业线' : '路线：创业线');
  }
  if (eff.org && ORGS[eff.org]){
    S.org = eff.org;
    if (eff.org !== 'none'){ S.rankOrg = orgRank(); toast(`组织：${ORGS[eff.org].name}`); }
    else toast('组织：不参加');
  }
  if (typeof eff.stress === 'number' && eff.stress !== 0) addStress(eff.stress);
  if (typeof eff.happy === 'number' && eff.happy !== 0) addHappy(eff.happy);
  if (typeof eff.familyRel === 'number' && eff.familyRel !== 0) addFamily(eff.familyRel);
  if (typeof eff.coins === 'number' && eff.coins !== 0) addCoins(eff.coins);
  if (typeof eff.career === 'number' && eff.career !== 0){
    S.career = Math.min(10, (S.career || 0) + eff.career);
    floatText(`职业等级 +${fmt1(eff.career)}`, 'gold');
  }
  if (typeof eff.diamond === 'number' && eff.diamond !== 0){ S.diamond += eff.diamond; floatText(`钻石 +${eff.diamond}`, 'blue'); }
  if (typeof eff.mem === 'number' && eff.mem !== 0 && !hasDup){ S.mem += eff.mem; floatText(`回忆碎片 +${eff.mem}`, 'gold'); }
  if (eff.aff){
    for (const k in eff.aff){
      if (!(k in S.aff)) continue;
      if (k === 'sunian' && (dup.sunian1 || dup.sunian2)) continue;
      if (k === 'baiyu' && (dup.baiyu1 || dup.baiyu2)) continue;
      addAff(k, eff.aff[k]);
    }
  }
  if (eff.item){
    for (const k in eff.item){ if (ITEMS[k]) giveItem(k, eff.item[k]); }
  }
  if (eff.flag){
    for (const k in eff.flag){
      if (k === 'flag1_sunian' && dup.sunian1) continue;
      if (k === 'baiyu1' && dup.baiyu1) continue;
      if ((k === 'baiyu2' || k === 'baiyuLover' || k === 'flag2') && dup.baiyu2) continue;
      if (k === 'flag2' && dup.sunian2) continue;
      if (typeof eff.flag[k] === 'number') S.flags[k] = (S.flags[k] || 0) + eff.flag[k];
      else S.flags[k] = eff.flag[k];
    }
  }
  if (hasDup) toast('该节点已由个人线发放，不再重复奖励', 2600);
  syncMainFlagNodes();
  if (eff.counter){
    for (const k in eff.counter){ S.flags[k] = (Number(S.flags[k]) || 0) + eff.counter[k]; }
  }
  if (eff.personality && PERSONALITY[eff.personality]){
    S.personality = eff.personality;
    toast(`性格：${PERSONALITY[eff.personality].name}`);
  }
  if (eff.family && FAMILY[eff.family]){
    const f = FAMILY[eff.family];
    S.family = eff.family;
    S.hidden.familyRel = f.familyRel;
    S.hidden.happy = clamp(S.hidden.happy + f.happy, 0, 100);
    S.stats.cha = clamp(S.stats.cha + f.cha, 0, 100);
    S.stats.int = clamp(S.stats.int + f.int, 0, 100);
    S.hidden.stress = clamp(S.hidden.stress + f.stress, 0, 100);
    toast(`原生家庭：${f.name}`);
  }
  if (eff.talent && TALENT[eff.talent]){
    S.talent = eff.talent;
    if (!S.spec) S.spec = { int: 0, cre: 0, str: 0 };
    if (eff.talent === 'art') S.spec.cre = Math.max(S.spec.cre || 0, 1);
    if (eff.talent === 'body') S.spec.str = Math.max(S.spec.str || 0, 1);
    if (eff.talent === 'lit') S.spec.int = Math.max(S.spec.int || 0, 1);
    toast(`天赋种子：${TALENT[eff.talent].name}`);
  }
  if (eff.track && ['sci','lib','art'].includes(eff.track)){
    S.track = eff.track;
    toast(`分科：${eff.track === 'sci' ? '理科' : eff.track === 'lib' ? '文科' : '艺体'}`);
  }
  if (eff.club && ['art','sport','none'].includes(eff.club)){
    S.club = eff.club;
    toast(`社团：${eff.club === 'art' ? '艺术社' : eff.club === 'sport' ? '体育社' : '不参加'}`);
  }
  if (eff.stress === 0 && eff.happy === 0 && eff.coins === 0 && !eff.aff){
    // 空效果：不提示
  }
  renderHUD();
  checkAch();
}

/* ---------------- 成就 ---------------- */
function checkAch(){
  if (!S) return;
  let got = false;
  ACHS.forEach(a => {
    if (S.achs[a.id]) return;
    let ok = false;
    try { ok = !!a.check(S); } catch(e){ ok = false; }
    if (!ok) return;
    S.achs[a.id] = Date.now();
    got = true;
    const r = a.reward || {};
    if (r.coins){ S.coins += r.coins; }
    if (r.diamond){ S.diamond += r.diamond; }
    if (r.mem){ S.mem += r.mem; }
    if (r.title){ if (!Array.isArray(S.titles)) S.titles = []; if (!S.titles.includes(r.title)) S.titles.push(r.title); }
    const parts = [];

    if (r.mem) parts.push(`回忆碎片 +${r.mem}`);

/* ---------------- 场景运行 ---------------- */
let scene = null;
let currentChoice = null;
let choiceSeq = 0;
let fullText = '';
let typePos = 0;
let typeAcc = 0;
let hintEl = null;

function dialogEl(){ return $('dialog'); }
function hideDialog(){
  const d = dialogEl();
  d.classList.add('empty');
  const t = $('dialogText'); if (t) t.textContent = '';
}
function showDialogBox(){
  dialogEl().classList.remove('empty');
}
function setHint(visible){
  const h = $('dialogHint');
  if (!h) return;
  h.style.display = visible ? 'block' : 'none';
}

function playScene(id){
  return new Promise(resolve => {
    const data = SCENES[id];
    if (!data){ resolve(); return; }
    ui.mode = 'scene'; ui.sceneActive = true; ui.choiceOpen = false;
    setBg(data.bg || 'classroom');
    renderSprites([], null);
    const queue = (data.steps || []).slice();
    const trigs = CG_SCENE_TRIGGERS[id] || [];
    for (let i = trigs.length - 1; i >= 0; i--){
      const t = trigs[i];
      if (!t.test || t.test()) queue.unshift({ t:'cg', id:t.id });
    }
    scene = { id, queue, pos: 0, resolve };
    clearChoices();
    hideDialog();
    nextStep();
  });
}
function abortScene(){
  if (!scene) return;
  const r = scene.resolve;
  scene = null; ui.sceneActive = false; ui.choiceOpen = false;
  clearChoices(); hideDialog();
  if (r) r();
}

function nextStep(){
  if (ui.mode === 'route' && scene && scene.route) return routeNext();
  if (!scene) return;
  if (scene.pos >= scene.queue.length){ return endScene(); }
  const st = scene.queue[scene.pos];
  if (!st){ scene.pos++; return nextStep(); }
  switch (st.t){
    case 'n': case 'c': case 'p': showLine(st); return;
    case 'cast':
      renderSprites(st.list || [], st.focus || null);
      scene.pos++; return nextStep();
    case 'fx':
      scene.pos++; showChapterCard(st).then(() => nextStep()); return;
    case 'give':
      giveItem(st.item, st.n || 1);
      if (st.note) floatText('获得 ' + st.note, 'gold');
      scene.pos++; return nextStep();
    case 'eff':
      applyEff(st.eff || {});
      if (st.toast) toast(st.toast);
      scene.pos++; return nextStep();
    case 'cg':
      scene.pos++;
      if (st.test && !st.test()) return nextStep();
      showCGViewer(st.id, { story:true, onClose:() => { if (scene) nextStep(); } });
      return;
    case 'dyn': {
      let arr = [];
      try { arr = st.fn() || []; } catch(e){ arr = []; }
      scene.queue.splice(scene.pos, 1, ...arr);
      return nextStep();
    }
    case 'form':
      scene.pos++;
      openForm(st.id).then(() => nextStep());
      return;
    case 'job':
      scene.pos++;
      determineJob();
      showJobCard().then(() => nextStep());
      return;
    case 'cert':
      scene.pos++;
      resolveCert();
      showCertCard().then(() => nextStep());
      return;
    case 'choice':
      showChoice(st);
      return;
    default:
      scene.pos++; return nextStep();
  }
}

function ensureSpeakerSprite(id){
  if (!id || !CHARS[id]) return;
  const list = getSprites();
  if (list.includes(id)) return;
  if (list.length === 0) renderSprites([id], id);
  else if (list.length === 1) renderSprites([list[0], id], id);
  else renderSprites([list[1], id], id);
}

function showLine(st){
  const isN = st.t === 'n';
  const isP = st.t === 'p';
  const id = st.id;
  const name = isN ? '旁白' : isP ? S.name : (CHARS[id] ? CHARS[id].name : '旁白');
  showDialogBox();
  const plate = $('namePlate');
  plate.textContent = name;
  plate.className = 'namePlate' + (isN ? ' narr' : '');
  if (!isN) ensureSpeakerSprite(id);
  setSpeakerFocus(isN ? null : id);
  fullText = interp(st.text);
  typePos = 0; typeAcc = 0;
  ui.typing = SETTINGS.speed < 999 && fullText.length > 0;
  const tEl = $('dialogText');
  tEl.textContent = ui.typing ? '' : fullText;
  setHint(!ui.typing);
  historyPush(name, fullText);
  if (!ui.typing){ /* 已全部显示 */ }
}

function finishTyping(){
  ui.typing = false;
  $('dialogText').textContent = fullText;
  setHint(true);
}

function clearChoices(){
  const c = $('choices');
  if (c) c.innerHTML = '';
  ui.choiceOpen = false;
  currentChoice = null;
}

function showChoice(st){
  currentChoice = st;
  ui.choiceOpen = true;
  showDialogBox();
  const plate = $('namePlate');
  plate.textContent = '选择';
  plate.className = 'namePlate narr';
  $('dialogText').textContent = interp(st.prompt || '');
  setHint(false);
  historyPush('选择', interp(st.prompt || ''));
  const c = $('choices');
  choiceSeq = scene ? scene.pos : 0;
  c.innerHTML = st.opts.map((o, i) => {
    const locked = o.need && !o.need(S);
    const key = `${scene ? scene.id : 'x'}:${choiceSeq}:${i}`;
    const read = !!READ[key];
    return `<button class="choiceBtn${locked ? ' locked' : ''}" data-opt="${i}">
      <span class="chMark">${locked ? '🔒' : (read ? '✓' : '·')}</span>
      <span class="chText">${interp(o.text)}</span>
      ${locked ? `<span class="chNeed">需 ${o.needText || '条件'}</span>` : ''}
    </button>`;
  }).join('');
  c.querySelectorAll('[data-opt]').forEach(btn => {
    btn.addEventListener('click', () => pickChoice(Number(btn.dataset.opt)));
  });
}

function pickChoice(i){
  if (!currentChoice || !scene) return;
  const o = currentChoice.opts[i];
  if (!o) return;
  if (o.need && !o.need(S)){
    toast(`条件不足：需要 ${o.needText || '满足条件'}`);
    Audio.sfx('error');
    return;
  }
  const key = `${scene.id}:${choiceSeq}:${i}`;
  markRead(key);
  Audio.sfx('choice');
  ui.choiceOpen = false;
  clearChoices();
  applyEff(o.eff || {});
  const replies = (o.reply || []).slice();
  if (replies.length) scene.queue.splice(scene.pos + 1, 0, ...replies);
  scene.pos++;
  nextStep();
}

function endScene(){
  const r = scene ? scene.resolve : null;
  scene = null; ui.sceneActive = false; ui.choiceOpen = false;
  clearChoices(); hideDialog();
  if (r) r();
}

function showChapterCard(card){

    const cc = $('chapterCard');
    ui.chapterOpen = true;
    $('ccKicker').textContent = card.kicker || '';
    $('ccTitle').textContent = card.title || '';

/* ---------------- 周流程 ---------------- */
async function startWeek(){
  if (!S) return;
  ui.mode = 'scene'; S.phase = 'scene';
  S.ap = CFG.apMax + (S.monthly ? 2 : 0);
  S.dim = S.dimNext; S.dimNext = false;
  S.weekRested = false; S.weekLog = []; S.weekStudy = 0;
  S.studyKitWeek = false;
  renderHUD();

  if (S.forcedRest > 0){
    const n = S.forcedRest; S.forcedRest = 0;
    let did = 0;
    for (let i = 0; i < n; i++){
      if (S.ap > 0){ S.ap -= 1; S.hidden.stress = clamp(S.hidden.stress - 20, 0, 100); gainStat('str', 0.5, true); did++; }
    }
    S.weekLog.push(`强制休息 ×${did}`);
    toast(`过劳后遗症：本周强制休息 ×${did}`);
    renderHUD();
  }

  try { weekSnapshot = JSON.parse(JSON.stringify(S)); } catch(e){ weekSnapshot = null; }
  const plan = getWeekPlan(S.week);
  if (plan.card) await showChapterCard(plan.card);
  for (const id of (plan.main || [])) await playScene(id);
  if (S.week !== 24){
    for (const id of (plan.bday || [])) await playScene(id);
  }
  for (const id of (plan.annual || [])) await playScene(id);
  if (plan.exam) await showExamCard(plan.exam);
  if (plan.final){ await finishAct3(); return; }
  beginAction();
}

function beginAction(){
  if (!S) return;
  S.phase = 'action'; ui.mode = 'action';
  clearChoices(); hideDialog();
  renderSprites([], null);
  renderHUD(); renderActionPanel();
  $('actionPanel').classList.add('show');

}

function hideActionPanel(){ $('actionPanel').classList.remove('show'); }

/* ---------------- 行动 ---------------- */
const ACTION_COST = { study: 2, hobby: 2, social: 2, work: 3, date: 3, rest: 1, org: 2, project: 2 };

/* 名校加成：第二幕 uni_elite 全部正向收益 ×1.1 */
function actMult(){
  if (!S) return 1;
  return (actOfWeek(S.week) === 2 && S.gaokao === 'uni_elite') ? 1.1 : 1;
}
function getWeekPlan(w){
  if (w >= CFG.act3Start) return WEEKS3[w] || {};
  if (!S) return WEEKS[w] || WEEKS_COL[w] || {};
  if (S.branch === 'col') return WEEKS_COL[w] || WEEKS[w] || {};
  return WEEKS[w] || WEEKS_COL[w] || {};
}
function orgRank(){
  if (!S || !S.org || S.org === 'none') return 'none';
  const c = S.contrib || 0;
  const capped = (S.branch === 'col');        // 大专线晋升上限 viceTop
  if (c >= 80 && S.flags.campaignDone && !capped) return 'top';
  if (c >= 60) return 'viceTop';
  if (c >= 40) return 'viceDept';
  return 'member';
}
function checkRankChange(quiet){
  if (!S || !S.org || S.org === 'none'){ if (S) S.rankOrg = 'none'; return; }
  const r = orgRank();
  if (S.rankOrg !== r){
    S.rankOrg = r;
    if (!quiet && r !== 'member') toast(`晋升：${RANKS[r].name}（贡献 ${fmt1(S.contrib)}/100）`);
  }
}
function addContrib(n, silent){
  if (!S) return;
  const before = S.contrib;
  const mult = n > 0 ? actMult() : 1;
  S.contrib = clamp(S.contrib + n * mult, 0, 100);
  if (!silent) floatText(`贡献 ${S.contrib - before >= 0 ? '+' : ''}${fmt1(S.contrib - before)}`, 'blue');
  checkRankChange(true);
}
function determineJob(){
  if (!S) return null;
  if (S.job_seed) return S.job_seed;
  const m = S.major, st = S.stats;
  let seed;
  if (S.branch === 'col'){
    /* 大专六类：专业 → 属性门槛，未达标兜底服务岗 */
    seed = 'service';
    if (m === 'nurse' && st.eq >= 55) seed = 'nurse';
    else if (m === 'tech' && st.int >= 55) seed = 'tech';
    else if (m === 'finance' && st.int >= 50 && st.eq >= 45) seed = 'finance';
    else if (m === 'edu' && st.eq >= 50 && st.cha >= 40) seed = 'edu';
    else if (m === 'design' && st.cre >= 55) seed = 'design';
  } else {
    seed = 'general';
    if (m === 'sci' && st.int >= 70) seed = 'tech';
    else if (m === 'lib' && st.int >= 65 && st.eq >= 60) seed = 'mgmt';
    else if (m === 'art' && st.cre >= 70 && (S.hobby || 0) >= 5) seed = 'creative';
    else if (m === 'sport' && st.str >= 70) seed = 'sport';
  }
  S.job_seed = seed;
  const r = orgRank();
  S.rankOrg = r;
  let bump = 0;
  if (r === 'top') bump = 2;
  else if (r === 'viceTop') bump = 1;
  if (bump){ S.jobBump = bump; S.career = Math.min(10, (S.career || 0) + bump); }
  toast(`职业判定：${jobSeedName(seed)}`);
  return seed;
}
function isStartupJob(){
  return !!(S && S.branch === 'col' && S.route === 'entrepreneur');
}
function paceMult(){
  const p = (S && PACES[S.pace]) ? PACES[S.pace] : PACES.normal;
  return p.mult;
}
function pathAttrBonus(){
  if (!S) return 0;
  const st = S.stats, p = S.jobPath;
  if (p === 'corp') return st.int * 0.4 + st.eq * 0.4;
  if (p === 'public') return st.eq * 0.45 + st.int * 0.35;
  if (p === 'expert') return st.cre * 0.45 + st.int * 0.35;
  if (p === 'skilled') return st.int * 0.45 + st.str * 0.35;
  if (p === 'service') return st.eq * 0.45 + st.cha * 0.35;
  return 0;
}
function careerScore(){ return (S.exp || 0) + pathAttrBonus(); }
function businessScore(){
  const key = S.industry || MAJOR_INDUSTRY[S.major] || 'shop';
  const ind = INDUSTRIES[key] || INDUSTRIES.shop;
  const core = S.stats[ind.attr] || 0;
  return (S.skill || 0) * 0.4 + (S.network || 0) * 0.3 + core * 0.15 + (S.stats.fin || 0) * 0.15;
}
function evalTitle(quiet){
  if (!S || S.week < CFG.act3Start || S.week > CFG.totalWeeks) return S ? S.title : null;
  let t;
  if (isStartupJob()){
    const sc = businessScore();
    t = sc >= 75 ? 'L4' : sc >= 55 ? 'L3' : sc >= 35 ? 'L2' : 'L1';
  } else {
    const sc = careerScore();
    t = sc >= 120 ? 'L5' : sc >= 100 ? 'L4' : sc >= 75 ? 'L3' : sc >= 45 ? 'L2' : 'L1';
    if (S.branch === 'col' && t === 'L5') t = 'L4';   // 低端线天花板 L4
  }
  if (t !== S.title){
    const prev = S.title;
    S.title = t;
    if (!quiet){
      const nm = isStartupJob() ? (TITLE_NAMES_BIZ[t] || t) : (TITLE_NAMES_EMP[t] || t);
      toast(`职级变更：${prev} → ${t} · ${nm}`, 2400);
      Audio.sfx('stat');
    }
  }
  return S.title;
}
function titleDisplay(){
  if (!S) return '—';
  const nm = isStartupJob() ? (TITLE_NAMES_BIZ[S.title] || '') : (TITLE_NAMES_EMP[S.title] || '');
  return `${S.title} · ${nm}`;
}
function careerTier(){
  const t = S.title || 'L1';
  if (isStartupJob()){
    return t === 'L4' ? '逆袭' : t === 'L3' ? '小有所成' : t === 'L2' ? '勉强维持' : '创业失败（体面兜底）';
  }
  return t === 'L5' ? '行业领袖' : t === 'L4' ? '中产稳定' : (t === 'L2' || t === 'L3') ? '普通职员' : '漂泊';
}
function jobSeedName(seed){
  const map = (S && S.branch === 'col') ? COLLEGE_JOB_SEEDS : JOB_SEEDS;
  return (map[seed] && map[seed].name) || (JOB_SEEDS[seed] && JOB_SEEDS[seed].name) || seed;
}
function majorName(){
  if (!S || !S.major) return '—';
  const map = (S.branch === 'col') ? COLLEGE_MAJORS : MAJORS;
  return (map[S.major] && map[S.major].name) || (MAJORS[S.major] && MAJORS[S.major].name) || S.major;
}
function resolveCert(){
  if (!S) return 'fail';
  const effort = S.certEffort || 0;
  const raw = S.stats.int * 0.75 + S.stats.eq * 0.1 + effort + (S.studyKitWeek ? 3 : 0);
  S.certScore = Math.round(raw * 10) / 10;
  S.cert = (S.certScore >= CERT_PASS_LINE) ? 'pass' : 'fail';
  if (S.cert === 'pass'){ addHappy(3, true); addCoins(60, true); }
  else { addHappy(-4, true); addStress(2, true); }
  toast(S.cert === 'pass' ? '资格证：合格' : '资格证：未通过', 2400);
  return S.cert;
}
function evalConfession(){
  if (!S) return false;
  if (S.flags.flag1_sunian && (S.aff.sunian || 0) >= 80){
    S.flags.flag2 = true;
    S.lover = 'sunian';
    return true;
  }
  return false;
}

async function performAction(id){
  if (!S || ui.mode !== 'action' || ui.busy) return;
  const cost = ACTION_COST[id];
  if (!cost){ return; }
  if (!isFinite(S.ap)) S.ap = 0;
  if (S.ap < cost){ toast('AP 不足：先休息，或结束本周'); Audio.sfx('error'); return; }
  if (id === 'date'){ openDatePicker(); return; }
  if (id === 'org'){
    if (actOfWeek(S.week) !== 2){ toast('组织活动只在第二幕可用'); return; }
    if (!S.org || S.org === 'none'){ toast('W27 招新后才能参加组织活动'); Audio.sfx('error'); return; }
  }
  if (id === 'project' && actOfWeek(S.week) !== 3){ toast('项目行动只在第三幕可用'); return; }
  ui.busy = true;
  try {
    Audio.sfx('tap');
    S.ap -= cost;
    if (id === 'study') actionStudy();
    else if (id === 'hobby') actionHobby();
    else if (id === 'social') actionSocial();
    else if (id === 'work') actionWork();
    else if (id === 'rest') actionRest();
    else if (id === 'org') actionOrg();
    else if (id === 'project') actionProject();
    await afterAction();
  } finally {
    ui.busy = false;
  }
}

function dimMult(){ return S.dim ? 0.9 : 1; }
function calmMult(){ return S.personality === 'calm' ? 1.1 : 1; }
function warmMult(){ return S.personality === 'warm' ? 1.1 : 1; }
function willMult(){ return S.personality === 'will' ? 1.1 : 1; }

function actionStudy(){
  const g = stepOf(S.stats.int) * willMult() * calmMult() * (S.studyKitWeek ? 1.1 : 1) * dimMult() * (1 + (S.spec.int || 0) * 0.05) * actMult();
  gainStat('int', g);
  if (actOfWeek(S.week) === 3){ S.skill = clamp((S.skill || 0) + 2 * paceMult(), 0, 100); floatText(`专业 +${fmt1(2 * paceMult())}`, 'blue'); }
  addStress(2);
  S.weekStudy++;
  if (S.weekStudy >= 3) S.flags.study3week = Math.max(S.flags.study3week || 0, 1);
  S.weekLog.push(`学习 · 智力 +${fmt1(Math.abs(g))}`);
}

function actionHobby(){
  const g = stepOf(S.stats.cre) * (1 + Math.min(0.15, S.hobby * 0.015)) * calmMult() * dimMult() * (1 + (S.spec.cre || 0) * 0.05) * actMult();
  gainStat('cre', g);
  if (actOfWeek(S.week) === 3){ S.skill = clamp((S.skill || 0) + 1.5 * paceMult(), 0, 100); floatText(`专业 +${fmt1(1.5 * paceMult())}`, 'blue'); }
  S.hobby = Math.min(10, S.hobby + 0.1);
  addStress(2);
  S.weekLog.push(`兴趣 · 创造力 +${fmt1(Math.abs(g))} · 专精 ${fmt1(S.hobby)}`);
}

function actionSocial(){
  const eqG = stepOf(S.stats.eq) * warmMult() * dimMult() * actMult();
  const chaG = stepOf(S.stats.cha) * 0.5 * warmMult() * dimMult() * actMult();
  gainStat('eq', eqG);
  gainStat('cha', chaG);
  if (actOfWeek(S.week) === 3){ S.network = clamp((S.network || 0) + 3 * paceMult(), 0, 100); floatText(`人脉 +${fmt1(3 * paceMult())}`, 'blue'); }
  addStress(1);
  S.weekLog.push(`社交 · 情商 +${fmt1(Math.abs(eqG))} · 魅力 +${fmt1(Math.abs(chaG))}`);
}

function actionWork(){
  const bonus = Math.min(0.9, S.career * 0.09);
  const g = (stepOf(S.stats.fin) + bonus) * willMult() * dimMult() * actMult();
  gainStat('fin', g);
  if (actOfWeek(S.week) === 3){ S.exp = clamp((S.exp || 0) + 5 * paceMult(), 0, 100); floatText(`经验 +${fmt1(5 * paceMult())}`, 'blue'); }

}

function actionOrg(){
  if (!S.org || S.org === 'none'){ toast('还没有加入组织'); return; }
  const gain = (8 + Math.random() * 5);
  addContrib(gain);
  const m = actMult();

/* ---------------- 随机事件 ---------------- */
let pendingRandom = null;
function pickRandomEvent(excludeId){
  if (!S) return null;
  const act = actOfWeek(S.week);
  const bucket = RANDOM_EVENT_POOL[act];
  if (!bucket) return null;
  if (!S.randSeen) S.randSeen = {};
  const seen = S.randSeen;
  let pos = bucket.pos.filter(e => !seen[e.id] && e.id !== excludeId);
  let neg = bucket.neg.filter(e => !seen[e.id] && e.id !== excludeId);
  if (!pos.length && !neg.length){
    bucket.pos.concat(bucket.neg).forEach(e => { delete seen[e.id]; });
    pos = bucket.pos.filter(e => e.id !== excludeId);
    neg = bucket.neg.filter(e => e.id !== excludeId);
  }
  const usePos = pos.length && (!neg.length || Math.random() < 0.6);
  let arr = usePos ? pos : neg;
  if (!arr.length) arr = usePos ? bucket.pos : bucket.neg;
  if (!arr.length) return null;
  return Object.assign({ kind: usePos ? 'pos' : 'neg' }, arr[Math.floor(Math.random() * arr.length)]);
}
function renderRandomPreview(ev, canReroll){
  if (!pendingRandom) return;
  pendingRandom.ev = ev;
  pendingRandom.canReroll = !!canReroll;
  const tag = ev.kind === 'neg' ? '小挫折 · 真实数值影响' : '小确幸 · 真实数值影响';
  const html = `${sheetHead('随机事件', tag, true)}
    <div class="sheetBody">
      <div class="secTitle">${ev.title}</div>
      <div class="statNote">${(ev.intro || []).join('<br>')}</div>
      <div class="rsCard" style="margin-top:calc(var(--ux)*2)">
        <div class="rsNote">${ev.kind === 'neg' ? '负面事件也会带来压力或损失，但选择得当可以减轻影响。' : '正面事件会实际增加属性、幸福度或资源。'}</div>
        <div class="rsNote">每次行动有 20% 概率触发；同名事件在同一局内不会重复，池子抽完会自动刷新。</div>
      </div>
      <div class="btnRow" style="margin-top:calc(var(--ux)*2.2)">
        <button class="btn primary" data-act="rand-go">进入事件</button>
        ${canReroll ? '<button class="btn ghost" data-act="rand-reroll">看视频重掷</button>' : '<button class="btn ghost disabled" disabled>本次已重掷</button>'}
      </div>
    </div>`;
  openSheet(html, { dismissible:false });
}
function offerRandomEvent(ev){
  return new Promise(resolve => {
    pendingRandom = { ev:ev, resolve:resolve, canReroll:true };
    renderRandomPreview(ev, true);
  });
}
function randomReroll(){
  if (!pendingRandom) return;
  const next = pickRandomEvent(pendingRandom.ev ? pendingRandom.ev.id : null);
  if (!next){ toast('没有其他可重掷的事件'); return; }
  Audio.sfx('stat');
  toast('激励视频占位：已重掷随机事件', 2200);
  renderRandomPreview(next, false);
}
function randomGo(){
  if (!pendingRandom) return;
  const ev = pendingRandom.ev, resolve = pendingRandom.resolve;
  pendingRandom = null;
  S.randSeen[ev.id] = true;
  closeSheet();
  playRandomScene(ev).then(() => { if (resolve) resolve(); });
}
function playRandomScene(ev){
  return new Promise(resolve => {
    hideActionPanel();
    ui.mode = 'scene'; ui.sceneActive = true; ui.choiceOpen = false;
    setBg(ev.bg || 'classroom');
    renderSprites(ev.cast || [], (ev.cast && ev.cast[0]) || null);
    const steps = [];
    (ev.intro || []).forEach(t => steps.push(nar(t)));
    steps.push(choice(ev.prompt || '你怎么做？', (ev.opts || []).map(o => opt(o.text, o.eff || {}, [nar(o.reply || '')]))));
    scene = { id:'rnd_' + ev.id, queue: steps, pos:0, resolve };
    clearChoices(); hideDialog();
    toast(ev.title, 1800);
    nextStep();
  });
}

async function afterAction(){

  if (S && S.phase === 'action' && Math.random() < 0.20){

/* ---------------- 考试 ---------------- */
function examTarget(ex){ return Math.max(0, ex.target - (S.examMercy || 0)); }

function resolveExam(ex){
  const target = examTarget(ex);
  S.examMercy = 0;
  const int = S.stats.int;
  const pass = int >= target;
  const margin = int - target;
  let rank, intGain = 0, coins = 0, item = null;

  if (pass){
    S.flags.examPass = (S.flags.examPass || 0) + 1;
    S.curStreak += 1;
    S.maxPassStreak = Math.max(S.maxPassStreak || 0, S.curStreak);
    if (margin >= 10) S.flags.overKill = true;
    if (ex.intGain){ intGain = ex.intGain; gainStat('int', intGain, true); }
    if (ex.coins){ coins = ex.coins; addCoins(coins, true); }
    if (!ex.final && Math.random() < 0.35){
      const pool = ['study', 'study', 'dessert', 'gear'];
      item = pool[Math.floor(Math.random() * pool.length)];
      giveItem(item, 1);
    }
    rank = margin >= 10 ? '年级前列 · 榜上有名' : '榜单中上 · 稳住了';
  } else {
    S.curStreak = 0;
    S.examMercy = 2;
    rank = `${ex.final ? '不如预期' : '中下游'} · 下一场目标线自动下调 2 点（不惩罚人格）`;
  }

  if (ex.final){
    if (int >= 60) S.gaokao = (int >= 75 && S.stats.eq >= 55) ? 'uni_elite' : 'uni';
    else S.gaokao = 'col';
  }

  const rec = { id: ex.id, name: ex.name, week: S.week, target, int, pass, rank, intGain, coins, item };
  S.examLog.push(rec);
  checkAch();
  return rec;
}

/* ---------------- 周结算 ---------------- */
function moodOfStress(v){
  if (v <= 30) return 'tier1';
  if (v <= 60) return 'tier2';
  if (v <= 80) return 'tier3';
  return 'tier4';
}

async function settleWeek(){
  if (!S || S.phase === 'settle') return;
  hideActionPanel();
  ui.mode = 'settle';
  const notes = [];
  const rows = [];

  // 生活基线压力 +1（性格修正生效）
  addStress(1, true);
  notes.push(`生活基线压力 +1（性格修正后：${fmt1(psm())}×）`);

  // W53 过劳强制判定（不可省略，先于自适应休息）
  if (S.week === 53){
    if (S.hidden.stress > 80){
      S.hidden.happy = clamp(S.hidden.happy - 10, 0, 100);
      S.hidden.stress = clamp(S.hidden.stress - 30, 0, 100);
      addCoins(-150, true);
      S.forcedRest = 2;
      S.flags.overwork = true;
      notes.push('W53 过劳强制判定：压力 > 80 → 幸福 −10、金币 −150、下周强制休息 ×2');
    } else {
      notes.push('W53 过劳检查：压力 ≤ 80，未触发强制判定');
    }
  }

  // 自适应：压力 >55 且本周未休息 → 自动牺牲一个行动位去休息
  if (S.hidden.stress > 55 && !S.weekRested){
    S.hidden.stress = clamp(S.hidden.stress - 20, 0, 100);
    gainStat('str', 0.5, true);
    notes.push('自适应规则：压力 > 55 且本周未休息，自动牺牲一个行动位去休息（压力 −20，体魄 +0.5）');
  }

  // 第三幕：生活节奏
  if (actOfWeek(S.week) === 3){
    if (S.pace === 'slow'){ addHappy(2, true); addStress(-2, true); notes.push('生活方式【慢活】：幸福 +2、压力 −2（成长 ×0.8）'); }
    else if (S.pace === 'burn'){ addHappy(-3, true); addStress(3, true); notes.push('生活方式【拼命】：幸福 −3、压力 +3（成长 ×1.3）'); }
    else notes.push('生活方式【正常】：成长与生活平衡');
  }

  // 压力分层
  const lv = moodOfStress(S.hidden.stress);
  if (lv === 'tier1'){
    addHappy(1, true);
    notes.push('压力 ≤ 30 · 轻松：幸福度 +1');
  } else if (lv === 'tier2'){
    notes.push('压力 30–60 · 正常：无额外影响');
  } else if (lv === 'tier3'){
    addHappy(-2, true);
    S.dimNext = true;
    notes.push('压力 60–80 · 疲惫：幸福度 −2，下周行动收益 −10%');
  } else {
    const top = topStat();
    gainStat(top, -1.5, true);
    addHappy(-5, true);
    S.forcedRest = 2;
    notes.push('压力 > 80 · 过劳：最高主属性（' + STAT_META.find(m => m.key === top).name + '）−1.5，幸福度 −5，下周强制休息 ×2');
  }

  // 考试判定
  let exam = null;
  const exDef = EXAMS.find(e => e.week === S.week);
  if (exDef){
    exam = resolveExam(exDef);
    if (exDef.final) rows.push({ k: '高考判定', v: gaokaoText() });
  }

  if (actOfWeek(S.week) === 3){
    evalTitle(true);
    S.rankOrg = orgRank();
    rows.push({ k: '职级', v: titleDisplay() });
    rows.push({ k: '经验 / 专业 / 人脉', v: `${fmt1(S.exp)} / ${fmt1(S.skill)} / ${fmt1(S.network)}` });
    rows.push({ k: '生活方式', v: PACES[S.pace || 'normal'].name });
    if (S.week === 53 && S.flags.overwork) rows.push({ k: '过劳判定', v: '已触发（强制）' });
    if (S.week >= 43 && S.week % 2 === 0){
      const yr = careerYearOfWeek(S.week);
      rows.push({ k: '年度结算', v: `第 ${yr} 年 · ${S.title} ${isStartupJob() ? '创业' : '就业'}` });
      checkRankChange();
    }
  }
  if (actOfWeek(S.week) === 2){
    S.rankOrg = orgRank();
    rows.push({ k: '组织', v: `${S.org && ORGS[S.org] ? ORGS[S.org].name : '未参加'} · ${RANKS[S.rankOrg].name}` });
    rows.push({ k: '贡献值', v: `${fmt1(S.contrib)}/100${S.gaokao === 'uni_elite' ? '（名校加成 ×1.1）' : ''}` });
    if (S.major) rows.push({ k: '专业', v: majorName() });
    if (S.week === 35 && S.cert) rows.push({ k: '资格证', v: `${S.cert === 'pass' ? '合格' : '未通过'}（分数 ${fmt1(S.certScore || 0)} / 及格线 ${CERT_PASS_LINE}）` });
    if (S.week === 37 && S.route) rows.push({ k: '路线', v: S.route === 'job' ? '职业线' : '创业线' });
    checkRankChange();
  }
  rows.unshift({ k: '压力', v: `${fmt1(S.hidden.stress)} · ${({tier1:'轻松',tier2:'正常',tier3:'疲惫',tier4:'过劳'})[lv]}` });
  rows.push({ k: '幸福度', v: fmt1(S.hidden.happy) });
  rows.push({ k: '家庭关系度', v: fmt1(S.hidden.familyRel) });
  if (S.flags.study3week >= 1 && S.weekStudy >= 3) rows.push({ k: '本周学习', v: `${S.weekStudy} 次（成就条件达成）` });

  S.lastSettle = {
    week: S.week,
    rows,
    notes,
    exam,
    log: S.weekLog.slice(),
    gaokao: S.gaokao || null,
    apLeft: S.ap
  };
  S.phase = 'settle';
  renderHUD();
  autosave();
  checkAch();
  showSettlementSheet(S.lastSettle);
}

const LC_KEYS = { legacy: 'lczx_v1_legacy', archive: 'lczx_v1_archive' };
let CURRENT_ENDING = null;

/* ---- 基础判定 ---- */
function allCharIds(){ return ['sunian','luchen','jiangwan','chengye','baiyu']; }
function bestAffCharId(){
  let best = 'sunian', bv = -1;
  allCharIds().forEach(k => { const v = S.aff[k] || 0; if (v > bv){ bv = v; best = k; } });
  return best;
}
function bestAffValue(){ return Math.max.apply(null, allCharIds().map(k => S.aff[k] || 0)); }
function relFlagCount(){
  const f = S.flags || {};
  return [f.flag1_sunian, f.flag2, f.baiyu1, f.baiyu2, f.baiyuLover].filter(Boolean).length;
}

function computeDims(){
  const intel = S.stats.int || 0;
  const study = clamp(intel + (S.next === 'grad' ? 10 : 0), 0, 100);
  const career = clamp((S.stats.fin || 0) * 0.55 + (S.career || 0) * 4.5, 0, 100);
  const self = clamp((S.stats.cre || 0) * 0.7 + (S.hobby || 0) * 3, 0, 100);
  return {
    love: clamp(bestAffValue(), 0, 100),
    career: Math.round(career * 10) / 10,
    family: clamp(S.hidden.familyRel || 0, 0, 100),
    self: Math.round(self * 10) / 10,
    study: Math.round(study * 10) / 10
  };
}
function mainDimOf(dims){
  let best = DIM_ORDER[0], bv = -1;
  DIM_ORDER.forEach(k => { if (dims[k] > bv){ bv = dims[k]; best = k; } });
  return best;
}
function qualityOf(happy){
  if (happy >= 70) return QUALITIES[0];
  if (happy >= 40) return QUALITIES[1];
  return QUALITIES[2];
}

/* ---- 结局正文 ---- */
function loveState(){
  const v = bestAffValue();
  if (v >= 80 && relFlagCount() >= 2) return 'got';
  if (v >= 60) return 'missed';
  return 'none';
}
function selfState(){
  const cre = S.stats.cre || 0, hb = S.hobby || 0;
  if (cre >= 75 && hb >= 5) return 'creator';
  if (cre >= 55) return 'hobby';
  return 'drawer';
}
function familyState(){
  const v = S.hidden.familyRel || 0;
  if (v >= 80) return 'whole';
  if (v >= 50) return 'distant';
  return 'apart';
}

    if (t === '小有所成' || t === '勉强维持') return { title:'自己做主的人', body:'你自己给自己发工资，也自己承担每一个决定。不轻松，但每一步都算数。' };
    if (t === '创业失败（体面兜底）') return { title:'体面地收场', body:'店关了，账也清了。你没有把这件事说成失败，只是换了条路继续走。' };

/* ---- 分享卡（canvas 绘制，无外部依赖） ---- */
function wrapCanvasText(g, text, x, y, maxW, lineH, maxLines){
  const chars = String(text).split('');
  let line = '', lines = [];
  for (let i = 0; i < chars.length; i++){
    const test = line + chars[i];
    if (g.measureText(test).width > maxW && line){
      lines.push(line); line = chars[i];
      if (lines.length >= (maxLines || 99) - 1) break;
    } else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((ln, i) => g.fillText(ln, x, y + i * lineH));
  return lines.length;
}
function drawShareCard(ratio){
  const end = CURRENT_ENDING;
  if (!end) return null;
  const compact = ratio === '1:1';
  const W = 1080, H = compact ? 1080 : 1440;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  if (!g) return null;
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fdf6ea'); bg.addColorStop(0.55, '#f6e6cd'); bg.addColorStop(1, '#eed5b4');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(150,104,66,.55)'; g.lineWidth = 3; g.strokeRect(48, 48, W - 96, H - 96);
  g.fillStyle = '#b85f5e'; g.fillRect(48, 48, 14, H - 96);

  const titleY = compact ? 190 : 230;
  const subY = compact ? 244 : 290;
  const judgeY = compact ? 305 : 360;
  g.fillStyle = '#8a6647'; g.font = `${compact ? 26 : 30}px "PingFang SC","Hiragino Sans GB",sans-serif`;
  g.fillText('人生自选 · 人生履历卡', 110, compact ? 130 : 140);
  g.fillStyle = '#4a3222'; g.font = `bold ${compact ? 58 : 66}px "Songti SC","Noto Serif SC","PingFang SC",serif`;
  g.fillText(end.mainTitle, 110, titleY);
  g.fillStyle = '#9b4d34'; g.font = `${compact ? 30 : 34}px "PingFang SC","Hiragino Sans GB",sans-serif`;
  g.fillText(`${end.tier} · ${end.quality} · ${end.mainName}`, 110, subY);

  g.fillStyle = '#6d5238'; g.font = `${compact ? 26 : 30}px "PingFang SC","Hiragino Sans GB",sans-serif`;
  wrapCanvasText(g, end.judgment, 110, judgeY, W - 220, compact ? 38 : 46, 2);

  /* 五维条形 */
  let y = compact ? 400 : 450;
  const dimGap = compact ? 46 : 62;
  const barH = compact ? 18 : 22;
  end.dimsMain.forEach(d => {
    g.fillStyle = '#5a3f2b'; g.font = `${compact ? 26 : 30}px "PingFang SC",sans-serif`;
    g.fillText(d.name, 110, y + barH);
    g.fillStyle = 'rgba(120,80,50,.14)';
    g.fillRect(240, y, W - 400, barH);
    const grd = g.createLinearGradient(240, 0, W - 160, 0);
    grd.addColorStop(0, '#d89186'); grd.addColorStop(1, '#b85f5e');
    g.fillStyle = grd; g.fillRect(240, y, (W - 400) * (d.value / 100), barH);
    g.fillStyle = '#9b4d34'; g.font = `${compact ? 24 : 27}px "PingFang SC",sans-serif`;
    g.fillText(String(Math.round(d.value)), W - 140, y + barH);
    y += dimGap;
  });

  /* 时间线 */
  y += compact ? 14 : 24;
  g.strokeStyle = 'rgba(120,80,50,.28)'; g.beginPath(); g.moveTo(110, y); g.lineTo(W - 110, y); g.stroke();
  y += compact ? 34 : 52;
  const tlGap = compact ? 30 : 44;
  end.timeline.forEach(t => {
    g.fillStyle = '#8a6647'; g.font = `${compact ? 23 : 27}px "PingFang SC",sans-serif`;
    g.fillText(`${t.age} 岁`, 110, y);
    g.fillStyle = '#5a3f2b'; g.font = `${compact ? 23 : 27}px "PingFang SC",sans-serif`;
    g.fillText(t.text, 230, y);
    y += tlGap;
  });

  /* 字段 */
  y += compact ? 14 : 24;
  const fields = [
    `感情：${end.lover && CHARS[end.lover] ? CHARS[end.lover].name : '一个人'}`,
    `压力：${Math.round(S.hidden.stress)} · 心情：${end.quality}`,
    `多周目天赋：${end.talent.name}（${end.talent.label}）`
  ];
  fields.forEach(f => {
    g.fillStyle = '#7d6249'; g.font = `${compact ? 23 : 27}px "PingFang SC",sans-serif`;
    g.fillText(f, 110, y);
    y += compact ? 28 : 42;
  });

  g.fillStyle = 'rgba(138,102,71,.85)'; g.font = `${compact ? 22 : 24}px "PingFang SC",sans-serif`;
  g.fillText('人生自选 · 60 周 · 三十岁', 110, H - 96);
  g.fillStyle = 'rgba(90,63,43,.5)'; g.font = `${compact ? 20 : 22}px "PingFang SC",sans-serif`;
  g.fillText(end.branch === 'col' ? '大专线' : '大学线', W - 250, H - 96);
  return c.toDataURL('image/png');
}

function openSheet(html, opts){
  const host = $('sheetHost');
  if (ui.sheetOpen && sheetResolve){ const r = sheetResolve; sheetResolve = null; try { r(); } catch(e){} }
  host.innerHTML = `<div class="scrim"></div><div class="sheet">${html}</div>`;
  host.classList.add('show');
  $('stage').classList.add('sheet-open');
  ui.sheetOpen = true;
  const o = opts || {};
  const scrim = host.querySelector('.scrim');
  if (scrim) scrim.addEventListener('click', () => { if (o.dismissible !== false) closeSheet(); });
  const p = new Promise(res => { sheetResolve = res; });
  return p;
}
function closeSheet(){
  const host = $('sheetHost');
  if (!host.classList.contains('show')) return;
  host.classList.remove('show');
  host.innerHTML = '';
  $('stage').classList.remove('sheet-open');
  ui.sheetOpen = false;
  const r = sheetResolve; sheetResolve = null;
  if (r){ try { r(); } catch(e){} }
}

const SLOTS = [
  { id:'auto', key:SK.auto, label:'自动存档' },
  { id:'slot1', key:SK.slot1, label:'存档 1' },
  { id:'slot2', key:SK.slot2, label:'存档 2' },

function saveTo(slotId){
  if (!S){ toast('还没有开始游戏'); return; }
  const inScene = (ui.mode === 'scene' || S.phase === 'scene');
  if (inScene && !weekSnapshot){ toast('对白中暂不能存档 · 本周剧情结束后会自动存档'); Audio.sfx('error'); return; }
  const slot = SLOTS.find(s => s.id === slotId);
  if (!slot) return;
  const payload = {
    state: S,
    snap: inScene ? weekSnapshot : null,
    meta: {
      phase: inScene ? 'scene' : S.phase, name: S.name, week: S.week, ap: S.ap, coins: S.coins,
      gaokao: S.gaokao || null, at: Date.now()
    },
    at: Date.now()
  };
  if (lsSet(slot.key, payload)){
    toast(`已保存到「${slot.label}」`);
    Audio.sfx('stat');
  } else toast('保存失败：存储空间可能已满');
}
function deleteSlot(slotId){
  const slot = SLOTS.find(s => s.id === slotId);
  if (!slot) return;
  try { localStorage.removeItem(slot.key); } catch(e){}
  toast('已删除该存档');
}
function openSave(mode){
  const isLoad = mode === 'load';
  const canSave = ui.mode === 'action' || ui.mode === 'settle' || ui.mode === 'done' || S.phase === 'action' || S.phase === 'settle' || S.phase === 'done';
  const rows = SLOTS.map(sl => {
    const p = lsGet(sl.key, null);
    let title = '空', desc = isLoad ? '点击读取' : '点击保存';
    if (p && p.meta){
      title = `${p.meta.name || '林晚'} · 第 ${p.meta.week} 周`;
      desc = `${p.meta.coins} 金币 · AP ${p.meta.ap}${p.meta.gaokao ? ' · 高考 ' + p.meta.gaokao : ''}`;
    }
    return `<div class="slot">
      <div class="slotFace">${charImg('player')}</div>
      <div class="sb"><div class="st"><span class="skTag">${sl.label}</span>${title}</div><div class="sd">${desc}</div></div>
      <div class="sa">
        ${isLoad ? `<button data-act="load" data-slot="${sl.id}" ${p ? '' : 'disabled'} style="${p ? '' : 'opacity:.35'}">读取</button>` : `<button data-act="save" data-slot="${sl.id}">保存</button>`}
        ${p ? `<button class="del" data-act="del" data-slot="${sl.id}">删除</button>` : ''}
      </div>
    </div>`;
  }).join('');
  const html = `
    ${sheetHead(isLoad ? '读档' : '存档', isLoad ? '读取会覆盖当前进度' : ((ui.mode === 'scene') ? '对白中存档：读档后重播本周剧情' : (canSave ? '当前进度可保存' : '对白中请稍后存档')))}
    <div class="sheetBody">
      <div class="statNote">1 个自动存档槽 + 3 个手动存档槽，刷新页面不会丢失。对白中的存档会记录本周开始时的状态，读档后重播本周剧情，数值不会重复结算。</div>
      ${rows}
      <div class="btnRow"><button class="btn ghost small" data-act="auto-now">立即自动存档</button></div>
    </div>`;
  openSheet(html);
}
function autosave(){
  if (!S || S.week < 1) return;
  if (!(ui.mode === 'action' || ui.mode === 'settle' || ui.mode === 'done')) return;
  const payload = {
    state: S,
    meta: { phase: S.phase, name: S.name, week: S.week, ap: S.ap, coins: S.coins, gaokao: S.gaokao || null, at: Date.now() },
    at: Date.now()
  };
  lsSet(SK.auto, payload);
}

function applyLoaded(p){
  if (!p || !p.state) return;
  closeSheet(); hideTitle();
  ui.mode = 'boot'; ui.formOpen = false;
  $('formHost').classList.remove('show'); $('formHost').innerHTML = '';
  hideActionPanel(); hideDialog(); clearChoices();
  if (p.meta && p.meta.phase === 'scene' && p.snap){
    S = normalizeState(p.snap);
    S.phase = 'scene';
    renderHUD();
    toast('已读档 · 重播本周剧情');
    startWeek();
    return;
  }
  S = normalizeState(p.state);
  resumeFromState();
}

function resumeFromState(){
  if (!S) return;
  if (S.phase === 'prologue' || !S.week || S.week < 1){ startNewGame(); return; }
  closeSheet(); hideTitle();
  hideActionPanel(); hideDialog(); clearChoices();
  renderHUD();
  if (S.phase === 'settle' && S.lastSettle){
    ui.mode = 'settle';
    showSettlementSheet(S.lastSettle);
    return;
  }
  if (S.phase === 'done'){
    ui.mode = 'done';
    if (S.finishedAct === 3){ if (!showLastEnding()) showResumeCard(); }
    else if (S.finishedAct === 2) showActEnd2Sheet();
    else showActEndSheet();
    if (S.finishedAct === 3) reportGameCompleteOnce();
    return;
  }
  S.phase = 'action'; ui.mode = 'action';
  setBg(S.lastBg || 'corridor');
  renderSprites([], null);
  $('actionPanel').classList.add('show');
  renderActionPanel(); renderHUD();
  autosave();
}

async function dateAction(target){
  if (!S || ui.mode !== 'action' || ui.busy) return;
  if (!S.met[target]){ toast('还没有认识这个角色'); return; }
  if (S.ap < 3){ toast('AP 不足'); Audio.sfx('error'); return; }
  ui.busy = true;
  try {
    S.ap -= 3;
    actionDate(target);
    await afterAction();
  } finally {
    ui.busy = false;
  }
}

  const ex = EXAMS.find(e => e.id === examId);

  const int = S.stats.int;
  const reach = int >= target;
  const html = `
    ${sheetHead('考试任务卡', `第 ${S.week} 周 · ${monthOfWeek(S.week)} 月`, true)}
    <div class="sheetBody">
      <div class="examCard">

        <h3>${ex.name}</h3>
        <div class="etar">达标只看智力：<b>≥ ${target}</b><br>当前智力：<b>${fmt1(int)}</b></div>
        <div class="ediag">${reach ? '按当前智力，本场可以达标。' : `还差 ${fmt1(target - int)} 点智力，用学习行动补上。`}<br>

let dimAnimTimer = null;
function fadeToBlack(ms){
  const f = $('fadeOverlay');
  if (f) f.classList.add('on');
  return new Promise(res => setTimeout(res, ms || 650));
}
function fadeFromBlack(ms){
  const f = $('fadeOverlay');
  setTimeout(() => { if (f) f.classList.remove('on'); }, ms || 240);
}
function revealDims(){
  const els = Array.prototype.slice.call(document.querySelectorAll('#sheetHost [data-dim]'));
  if (!els.length || !CURRENT_ENDING) return;
  const dur = 2700;
  const startTs = Date.now();
  const finish = () => {
    els.forEach(el => { el.style.width = ((CURRENT_ENDING.dims[el.dataset.dim]) || 0) + '%'; });
  };
  const step = () => {
    const t = Math.min(1, (Date.now() - startTs) / dur);
    els.forEach(el => { el.style.width = (((CURRENT_ENDING.dims[el.dataset.dim]) || 0) * t) + '%'; });
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  clearTimeout(dimAnimTimer);
  dimAnimTimer = setTimeout(finish, dur + 90);
}
function skipReveal(){
  if (!CURRENT_ENDING) return;
  const els = Array.prototype.slice.call(document.querySelectorAll('#sheetHost [data-dim]'));
  els.forEach(el => { el.style.width = ((CURRENT_ENDING.dims[el.dataset.dim]) || 0) + '%'; });
  clearTimeout(dimAnimTimer);
}
