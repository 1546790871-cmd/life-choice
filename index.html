/* ---------------- 主循环 ---------------- */
let lastTs = 0, autoTimer = 0, autoAcc = 0;
function frame(ts){
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  // 打字机
  if (ui.typing){
    const speed = SETTINGS.speed >= 999 ? 9999 : SETTINGS.speed;
    typeAcc += dt * speed;
    const n = Math.floor(typeAcc);
    if (n > 0){
      typeAcc -= n;
      typePos = Math.min(fullText.length, typePos + n);
      $('dialogText').textContent = fullText.slice(0, typePos);
      if (typePos >= fullText.length){ ui.typing = false; setHint(true); }
    }
  }
  // 自动播放
  if (SETTINGS.auto && ui.mode === 'scene' && scene && !ui.typing && !ui.choiceOpen && !ui.sheetOpen && !ui.chapterOpen && !ui.formOpen && !ui.titleOpen){
    autoTimer += dt;
    if (autoTimer > 1.5){
      autoTimer = 0;
      scene.pos++;
      nextStep();
    }
  } else autoTimer = 0;
  // 音乐
  if (Audio.started) Audio.schedule();
  requestAnimationFrame(frame);
}

/* ---------------- 结算上报 helper（与 bridge 契约一致） ---------------- */
var callSeq = 0;
function createGameSessionId(){
  var cryptoObj = typeof crypto !== 'undefined' ? crypto : undefined;
  if (cryptoObj && typeof cryptoObj.randomUUID === 'function') return cryptoObj.randomUUID();
  return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
}
function reportGameComplete(options){
  var win = typeof window !== 'undefined' ? window : undefined;
  var webview = win && win.ReactNativeWebView;
  if (!webview || typeof webview.postMessage !== 'function') return;
  var opts = options && typeof options === 'object' ? options : {};
  var payload = { completed: true };
  var MAXLEN = 12;
  var score = opts.score;
  var valid = false;
  if (typeof score === 'number' && isFinite(score)) valid = true;
  else if (typeof score === 'string'){ var txt = score.trim(); if (txt && txt.length <= MAXLEN) score = txt; else valid = false; }
  else valid = false;
  if (valid && score !== undefined && score !== '') {
    payload.score = score;
    payload.scoreType = opts.scoreType === 'percent' ? 'percent' : 'score';
  }
  if (typeof opts.appId === 'string'){ var aid = opts.appId.trim(); if (aid) payload.appId = aid; }
  if (typeof opts.sessionId === 'string'){ var sid = opts.sessionId.trim(); if (sid) payload.sessionId = sid; }
  callSeq += 1;
  try {
    webview.postMessage(JSON.stringify({
      id: 'call_' + Date.now().toString(36) + '_' + callSeq,
      type: 'request',
      action: 'game.complete',
      payload: payload
    }));
  } catch (err){ /* 桌面预览静默 no-op */ }
}

/* ================= 五线 Flag 节点互斥 ================= */
function flagNodeKey(week, tier){ return week + ':' + tier; }
function flagNodeOwner(week, tier){

  if (!R) return openRouteSelect();
  const book = routeBook();
  const icons = ['🎁','🌧','📷','🍲','💌','☕','🏀','🖼'];
  const rows = (book.events || []).map((ev, i) => {
    const done = !!(R.events && R.events[ev.id]);
    const avail = ev.triggerWeek === 0 || ev.triggerWeek <= routeWeek();
    return `<div class="cardItem">
      <div class="face" style="display:flex;align-items:center;justify-content:center;font-size:calc(var(--ux)*6)">${icons[i % icons.length]}</div>
      <div class="fb">
        <div class="fn">${ev.title}<span class="tag">${ev.triggerWeek ? '第 ' + ev.triggerWeek + ' 周后' : '任意周'}</span></div>
        <div class="fd">${ev.intro && ev.intro[0] ? (typeof ev.intro[0] === 'string' ? ev.intro[0] : ev.intro[0].text) : '个人线专属日常。'}</div>
        <div class="fs">${done ? '已触发' : avail ? '可触发 · 不发放 Flag' : '尚未解锁'}</div>
      </div>
      ${done ? '' : `<button class="btn small ${avail ? 'primary' : 'disabled'}" data-route="event:${ev.id}" style="min-width:calc(var(--ux)*22)">进入</button>`}
    </div>`;
  }).join('');
  openSheet(`${sheetHead(`${book.name} · 日常小事件`, `${(book.events || []).length} 则 · 只影响好感与情绪 · 不发放 Flag`)}
    <div class="sheetBody">${rows}
      <div class="btnRow" style="margin-top:calc(var(--ux)*1.6)"><button class="btn ghost small" data-route="select">返回个人线入口</button></div>
    </div>`);
}
function routePlayEvent(id){
  const book = routeBook();
  if (!book || !R) return;
  const ev = (book.events || []).find(x => x.id === id);
  if (!ev || (R.events && R.events[ev.id])) return;
  if (!(ev.triggerWeek === 0 || ev.triggerWeek <= routeWeek())){ toast('还未到触发周次'); return; }
  closeSheet();
  const cast = (ev.cast && ev.cast.length) ? ev.cast : [R.char];
  const steps = [{ t:'cast', list:cast, focus:cast[0] }];
  (ev.intro || []).forEach(x => steps.push(typeof x === 'string' ? { t:'n', text:x } : x));
  steps.push({ t:'choice', prompt:'', opts: ev.opts });
  scene = { id:'route_event_' + id, queue: steps, pos:0, route:true, event: ev };
  ui.mode = 'route'; ui.sceneActive = true; ui.choiceOpen = false;
  setBg(ev.bg); renderSprites(cast, cast[0]);
  hideDialog(); clearChoices(); routeUpdateHud();
  routeNext();
}
function routeEventResult(ev){
  if (R && ev){ if (!R.events) R.events = {}; R.events[ev.id] = true; }
  routeSave();
  const html = `${sheetHead(`${routeCharName()} · 日常小事件`, ev ? ev.title : '', true)}
    <div class="sheetBody">
      <div class="routeSettle">
        <div class="rsK">小事件结束</div>
        <h3>${ev ? ev.title : ''}</h3>
        <div class="rsSub">好感 ${Math.round(R.aff)} · 心情 ${Math.round(R.happy)} · 压力 ${Math.round(R.stress)}</div>
        <div class="rsCard"><div class="rsNote">小事件不发放 Flag，只会改变个人线的好感与情绪。</div></div>
        <div class="btnRow" style="margin-top:calc(var(--ux)*2.2)">
          <button class="btn primary" data-route="select">回到个人线</button>
        </div>
      </div>
    </div>`;
  openSheet(html);
}
function routeHandleAction(k){
  if (!k) return;
  const parts = k.split(':');
  const act = parts[0], arg = parts.slice(1).join(':');
  if (act === 'continue'){ routeStart(false, arg || (R && R.char)); return; }
  if (act === 'recap'){
    const id = arg || (R && R.char) || 'sunian';
    R = routeLoad(id);
    if (!R) return openRouteSelect();
    closeSheet(); hideTitle(); $('stage').classList.add('route-mode');
    ui.mode = 'route'; ui.sceneActive = false; scene = null; routeUpdateHud(); routeSave(); routeEndingRecap();
    return;
  }
  if (act === 'new'){ routeStart(true, arg || (R && R.char)); return; }
  if (act === 'restart'){
    const id = arg || (R && R.char) || 'sunian';
    const nm = (routeBook(id) || {}).name || '该角色';
    confirmSheet('重新开始个人线', `会清空${nm}个人线的进度、好感与 Flag，主线存档与其他角色不受影响。`, '重新开始').then(ok => {
      if (ok){ R = routeNew(id); routeSave(); routeStart(true, id); }
    });
    return;
  }
  if (act === 'next'){ closeSheet(); routePlayScene(); return; }
  if (act === 'back'){ closeSheet(); return; }
  if (act === 'select'){ closeSheet(); openRouteSelect(); return; }
  if (act === 'events'){ openRouteEvents(); return; }
  if (act === 'exit'){ routeExit(); return; }
  if (act === 'epilogue'){ routePlayEpilogue(); return; }
  if (act === 'replayEnding'){
    if (R){
      const book = routeBook();
      const eid = R.ended || R.judged || 'stay';
      R.ended = null;
      if (book){ R.ch = book.chapters.length - 1; R.sc = routeEndingIndex(book, eid); }
      routeSave();
    }
    closeSheet(); routePlayScene(); return;
  }
  if (act === 'event'){ routePlayEvent(arg); return; }
}

/* ---------------- 启动 ---------------- */
function preloadArt(){
  const seen = {};
  Object.keys(BG_ART).forEach(k => {
    const u = bgUrl(k);
    if (seen[u]) return; seen[u] = 1;
    const im = new Image(); im.src = u;
  });
  ['sunian','luchen','jiangwan','chengye','baiyu','player_f','player_m'].forEach(n => {
    const im = new Image(); im.src = `assets/char/${n}.webp`;
  });
}
function boot(){
  loadSettings();
  sessionId = createGameSessionId();
  bindEvents();
  updateMuteIcon();
  renderHUD();
  preloadArt();
  setBg('gate');
  requestAnimationFrame(frame);

  const auto = lsGet(SK.auto, null);
  if (auto && auto.state && auto.state.week >= 1){
    try {
      S = normalizeState(auto.state);
      if (auto.meta && auto.meta.phase === 'scene' && auto.snap) S = normalizeState(auto.snap);
      resumeFromState();
      toast('已恢复自动存档 · 第 ' + S.week + ' 周', 2200);
      return;
    } catch(e){ /* 落到新游戏 */ }
  }
  startNewGame();
}
window.addEventListener('DOMContentLoaded', () => { try { boot(); } catch(e){ console.error('boot failed', e); } });

</script>
